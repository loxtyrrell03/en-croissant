<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1590" viewBox="0 0 1120 1590" role="img">
<title>C - Source manager</title><desc>Editable En Croissant native evaluation-data workflow. All shown data are invented examples. No download or profile operation.</desc><rect width="1120" height="1590" fill="#1a1b1e"/><g font-family="Times New Roman, serif">
<text x="24" y="34" font-size="28" fill="#c1c2c5" font-weight="700">C  Source manager</text>
<text x="24" y="63" font-size="17" fill="#909296" font-weight="400">Manage the active store and each download as rows with their actions expanded inline.</text>
<text x="24" y="87" font-size="15" fill="#909296" font-weight="400">DESIGN EXAMPLES · desktop Settings · invented data · cyan / serif from the existing theme</text>
<g id="C-main" aria-label="1  Main view">
<rect x="24" y="108" width="728" height="350" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="40" y="136" font-size="20" fill="#c1c2c5" font-weight="700">1  Main view</text>
<path d="M24,150H752" stroke="#373a40"/>
<text x="44" y="184" font-size="23" fill="#c1c2c5" font-weight="700">Settings / Data sources</text>
<text x="44" y="220" font-size="16" fill="#909296" font-weight="400">Source</text>
<text x="356" y="220" font-size="16" fill="#909296" font-weight="400">Status</text>
<text x="567" y="220" font-size="16" fill="#909296" font-weight="400">Action</text>
<path d="M44,232H728" stroke="#373a40"/>
<text x="44" y="264" font-size="19" fill="#c1c2c5" font-weight="700">Evaluations · current</text>
<text x="356" y="264" font-size="17" fill="#15aabf" font-weight="400">Ready</text>
<rect x="567" y="242" width="150" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="579" y="264" font-size="16" fill="#c1c2c5" font-weight="400">Choose folder</text>
<text x="44" y="289" font-size="16" fill="#909296" font-weight="400">1.2 million positions · C:\ChessData\eval-current</text>
<path d="M44,309H728" stroke="#373a40"/>
<text x="44" y="341" font-size="19" fill="#c1c2c5" font-weight="400">New evaluation download</text>
<rect x="533" y="318" width="184" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="545" y="340" font-size="16" fill="#c1c2c5" font-weight="400">Review download</text>
<text x="44" y="375" font-size="16" fill="#909296" font-weight="400">Completed and interrupted downloads stay in this list.</text>
</g>
<g id="C-narrow" aria-label="320px · compact desktop">
<rect x="776" y="108" width="320" height="350" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="792" y="136" font-size="20" fill="#c1c2c5" font-weight="700">320px · compact desktop</text>
<path d="M776,150H1096" stroke="#373a40"/>
<text x="792" y="182" font-size="21" fill="#c1c2c5" font-weight="700">Data sources</text>
<text x="792" y="215" font-size="20" fill="#c1c2c5" font-weight="700">Evaluation data</text>
<circle cx="942" cy="209" r="9" fill="none" stroke="#909296"/>
<text x="939" y="214" font-size="14" fill="#909296" font-weight="400">?</text>
<text x="792" y="244" font-size="17" fill="#15aabf" font-weight="400">Ready · 1.2 million positions</text>
<text x="792" y="270" font-size="16" fill="#909296" font-weight="400">C:\ChessData\eval-current</text>
<rect x="792" y="292" width="288" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="804" y="314" font-size="16" fill="#c1c2c5" font-weight="400">Choose folder</text>
<rect x="792" y="337" width="288" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="804" y="359" font-size="16" fill="#c1c2c5" font-weight="400">Review download</text>
<text x="792" y="402" font-size="16" fill="#909296" font-weight="400">Desktop folder choices do not change the</text>
<text x="792" y="425" font-size="16" fill="#909296" font-weight="400">phone service.</text>
</g>
<g id="C-review" aria-label="2  Expanded download row">
<rect x="24" y="480" width="524" height="322" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="40" y="508" font-size="20" fill="#c1c2c5" font-weight="700">2  Expanded download row</text>
<path d="M24,522H548" stroke="#373a40"/>
<text x="42" y="549" font-size="17" fill="#c1c2c5" font-weight="400">Official archive · compressed download 9.8 GiB</text>
<text x="42" y="580" font-size="16" fill="#909296" font-weight="400">New output folder</text>
<rect x="42" y="589" width="488" height="32" rx="4" fill="#1a1b1e" stroke="#373a40"/>
<text x="52" y="611" font-size="16" fill="#c1c2c5" font-weight="400">C:\ChessData\eval-new</text>
<text x="42" y="653" font-size="16" fill="#909296" font-weight="400">Maximum build space</text>
<rect x="42" y="662" width="228" height="32" rx="4" fill="#1a1b1e" stroke="#373a40"/>
<text x="52" y="684" font-size="16" fill="#c1c2c5" font-weight="400">64 GiB</text>
<text x="300" y="653" font-size="16" fill="#909296" font-weight="400">Available disk space</text>
<text x="300" y="684" font-size="17" fill="#c1c2c5" font-weight="400">240 GiB</text>
<text x="42" y="725" font-size="16" fill="#909296" font-weight="400">Build limit includes temporary files. Data stays active.</text>
<rect x="42" y="749" width="134" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="54" y="771" font-size="16" fill="#c1c2c5" font-weight="400">Cancel</text>
<rect x="190" y="749" width="208" height="34" rx="4" fill="#15aabf" stroke="#373a40"/>
<text x="202" y="771" font-size="16" fill="#ffffff" font-weight="700">Download &amp; prepare</text>
</g>
<g id="C-progress" aria-label="3  Running download row">
<rect x="572" y="480" width="524" height="322" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="588" y="508" font-size="20" fill="#c1c2c5" font-weight="700">3  Running download row</text>
<path d="M572,522H1096" stroke="#373a40"/>
<text x="590" y="551" font-size="21" fill="#c1c2c5" font-weight="700">Receiving archive</text>
<text x="590" y="585" font-size="17" fill="#c1c2c5" font-weight="400">Archive received: 2.4 GiB of 9.8 GiB</text>
<rect x="590" y="605" width="488" height="8" rx="4" fill="#1a1b1e" stroke="#373a40"/>
<rect x="590" y="605" width="119" height="8" rx="4" fill="#15aabf" stroke="#15aabf"/>
<text x="590" y="646" font-size="16" fill="#909296" font-weight="400">Next: prepare the downloaded evaluations</text>
<rect x="590" y="669" width="166" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="602" y="691" font-size="16" fill="#c1c2c5" font-weight="400">Cancel download</text>
<rect x="770" y="669" width="138" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="782" y="691" font-size="16" fill="#c1c2c5" font-weight="400">Close view</text>
<text x="590" y="739" font-size="16" fill="#909296" font-weight="400">After Cancel: Stopping… until the worker exits.</text>
<text x="590" y="769" font-size="16" fill="#909296" font-weight="400">Closing this view keeps the job running.</text>
</g>
<g id="C-interrupted" aria-label="4  Interrupted download row">
<rect x="24" y="824" width="524" height="270" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="40" y="852" font-size="20" fill="#c1c2c5" font-weight="700">4  Interrupted download row</text>
<path d="M24,866H548" stroke="#373a40"/>
<text x="42" y="895" font-size="21" fill="#c1c2c5" font-weight="700">Download interrupted</text>
<text x="42" y="927" font-size="17" fill="#c1c2c5" font-weight="400">Remove this incomplete download before reviewing a fresh one. The</text>
<text x="42" y="950" font-size="17" fill="#c1c2c5" font-weight="400">current store is unchanged.</text>
<text x="42" y="987" font-size="16" fill="#909296" font-weight="400">C:\ChessData\eval-new</text>
<rect x="42" y="1010" width="242" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="54" y="1032" font-size="16" fill="#c1c2c5" font-weight="400">Remove incomplete download</text>
<text x="42" y="1073" font-size="16" fill="#909296" font-weight="400">Completed stores are always retained.</text>
</g>
<g id="C-cleanup" aria-label="5  Cleanup confirmation / refusal">
<rect x="572" y="824" width="524" height="270" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="588" y="852" font-size="20" fill="#c1c2c5" font-weight="700">5  Cleanup confirmation / refusal</text>
<path d="M572,866H1096" stroke="#373a40"/>
<text x="590" y="892" font-size="20" fill="#c1c2c5" font-weight="700">Remove only this incomplete download?</text>
<text x="590" y="923" font-size="16" fill="#909296" font-weight="400">C:\ChessData\eval-new</text>
<rect x="590" y="944" width="116" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="602" y="966" font-size="16" fill="#c1c2c5" font-weight="400">Keep files</text>
<rect x="720" y="944" width="216" height="34" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="732" y="966" font-size="16" fill="#c1c2c5" font-weight="400">Remove incomplete</text>
<text x="590" y="1011" font-size="17" fill="#fa5252" font-weight="400">If validation fails: Folder contains unfamiliar files. Files kept.</text>
</g>
<g id="C-states" aria-label="6  Setup, details, help and settled states">
<rect x="24" y="1116" width="1072" height="260" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="40" y="1144" font-size="20" fill="#c1c2c5" font-weight="700">6  Setup, details, help and settled states</text>
<path d="M24,1158H1096" stroke="#373a40"/>
<text x="42" y="1190" font-size="18" fill="#c1c2c5" font-weight="700">Checking</text>
<text x="42" y="1213" font-size="16" fill="#909296" font-weight="400">Checking current store…</text>
<text x="570" y="1190" font-size="18" fill="#c1c2c5" font-weight="700">Not connected</text>
<text x="570" y="1213" font-size="16" fill="#909296" font-weight="400">Choose folder / Review download</text>
<text x="42" y="1250" font-size="18" fill="#c1c2c5" font-weight="700">Unavailable</text>
<text x="42" y="1273" font-size="16" fill="#909296" font-weight="400">Cannot read folder. Retry check.</text>
<text x="570" y="1250" font-size="18" fill="#c1c2c5" font-weight="700">Finished</text>
<text x="570" y="1273" font-size="16" fill="#909296" font-weight="400">Ready to use · Use evaluations</text>
<text x="42" y="1310" font-size="18" fill="#c1c2c5" font-weight="700">Activation failed</text>
<text x="42" y="1333" font-size="16" fill="#909296" font-weight="400">Previous folder retained. Retry.</text>
<text x="570" y="1310" font-size="18" fill="#c1c2c5" font-weight="700">Other window active</text>
<text x="570" y="1333" font-size="16" fill="#909296" font-weight="400">Check that window; no cleanup.</text>
</g>
<g id="C-help" aria-label="Help / ownership / errors">
<rect x="24" y="1398" width="1072" height="168" rx="4" fill="#25262b" stroke="#373a40"/>
<text x="40" y="1426" font-size="20" fill="#c1c2c5" font-weight="700">Help / ownership / errors</text>
<path d="M24,1440H1096" stroke="#373a40"/>
<text x="42" y="1465" font-size="17" fill="#c1c2c5" font-weight="400">? Maximum build space counts temporary and completed files together. Downloading a new store does not select it.</text>
<text x="42" y="1517" font-size="17" fill="#909296" font-weight="400">Expired review, changed source, invalid folder and unreadable recovery record stay visible and retryable. No automatic download, cleanup or</text>
<text x="42" y="1540" font-size="17" fill="#909296" font-weight="400">source switch.</text>
</g>
</g></svg>
