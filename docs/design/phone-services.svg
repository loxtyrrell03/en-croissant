<svg xmlns="http://www.w3.org/2000/svg" width="820" height="590" viewBox="0 0 820 590">
<rect width="820" height="590" fill="#111315"/>
<g font-family="system-ui,Segoe UI,sans-serif" fill="#f1f3f5">
<text x="24" y="34" font-size="20" font-weight="700">Phone service control</text>
<text x="24" y="59" font-size="13" fill="#a6a7ab">Proposed compact addition. Example states, not live service readings.</text>
<g transform="translate(24 85)">
<rect width="370" height="64" rx="9" fill="#1d1f21" stroke="#303236"/>
<rect x="3" y="3" width="70" height="58" rx="7" fill="#343638"/>
<g font-size="14" font-weight="600"><text x="16" y="37">Board</text><text x="86" y="37">Import</text><text x="160" y="37">Review</text><text x="239" y="37">Files</text><text x="303" y="37">Stats</text></g>
<text x="5" y="96" font-size="14" font-weight="700">PC services</text><circle cx="113" cy="91" r="9" fill="#24262a"/><text x="109" y="96" font-size="13">?</text>
<text x="221" y="96" font-size="13" fill="#8ce99a">Ready</text><rect x="314" y="77" width="50" height="28" rx="14" fill="#1971c2"/><circle cx="350" cy="91" r="10" fill="white"/>
<rect y="131" width="370" height="214" rx="10" fill="#202824"/><text x="98" y="244" font-size="18" fill="#a6a7ab">Existing board</text>
</g>
<g transform="translate(426 85)">
<text x="0" y="18" font-size="16" font-weight="700">Starting / recovery</text>
<rect y="36" width="370" height="89" rx="9" fill="#191c1e" stroke="#303236"/>
<text x="12" y="67" font-size="14" font-weight="700">PC services  ?</text><text x="197" y="67" font-size="13" fill="#a5d8ff">Starting…</text><rect x="308" y="48" width="50" height="28" rx="14" fill="#1971c2"/><circle cx="344" cy="62" r="10" fill="white"/>
<text x="12" y="102" font-size="13" fill="#a6a7ab">Engine starting · Reviews ready</text>
<text x="0" y="165" font-size="16" font-weight="700">Off</text>
<rect y="182" width="370" height="89" rx="9" fill="#191c1e" stroke="#303236"/>
<text x="12" y="213" font-size="14" font-weight="700">PC services  ?</text><text x="263" y="213" font-size="13" fill="#a6a7ab">Off</text><rect x="308" y="194" width="50" height="28" rx="14" fill="#45474b"/><circle cx="322" cy="208" r="10" fill="white"/>
<text x="12" y="249" font-size="13" fill="#a6a7ab">PC analysis and reviews are stopped.</text>
<text x="0" y="313" font-size="16" font-weight="700">Failure</text>
<rect y="331" width="370" height="100" rx="9" fill="#191c1e" stroke="#303236"/>
<text x="12" y="362" font-size="14" font-weight="700">PC services  ?</text><text x="214" y="362" font-size="13" fill="#ffc078">Unavailable</text>
<text x="12" y="392" font-size="13" fill="#ffc078">Services could not start.</text><text x="306" y="414" font-size="14" fill="#74c0fc">Retry</text>
</g>
<text x="24" y="488" font-size="14" font-weight="700">Help, available by hover, focus or tap</text>
<text x="24" y="515" font-size="14" fill="#c1c2c5">Starts the PC engine and review server. The PC must be awake and connected to Tailscale.</text>
<text x="24" y="548" font-size="14" fill="#c1c2c5">Before switching off: Stops PC analysis and reviews. Saved games stay.</text>
</g></svg>
