[package]
name = "encroissant-tournament-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.12.5", features = ["blocking", "json", "stream"] }
scraper = "0.24"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.28", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
fs2 = "0.4"
getrandom = "0.3"
zstd = "0.13"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
